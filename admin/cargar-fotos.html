<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargar varias fotos | DPA</title><style>body{margin:0;background:#101114;color:#fff;font:16px Arial}.c{max-width:650px;margin:40px auto;padding:28px;background:#1d1f25;border-radius:16px}label,select,input,button{display:block;width:100%;box-sizing:border-box;margin:14px 0}select,input{padding:13px;background:#111;color:#fff;border:1px solid #555;border-radius:8px}button{padding:14px;background:#f15a24;color:#fff;border:0;border-radius:8px;font-weight:bold;font-size:16px}.note{color:#cfd3dc;line-height:1.45}.status{padding:12px;border-radius:8px;background:#29344b;display:none}.status.on{display:block}.cover{display:flex;gap:8px;align-items:center}.cover input{width:auto}</style><main class="c"><h1>Cargar varias fotos</h1><p class="note">Elegí un vehículo y marcá todas las fotos juntas desde la carpeta. No uses el selector viejo.</p><label>Vehículo</label><select id="v"><option>Cargando vehículos…</option></select><label>Fotos</label><input id="f" type="file" accept="image/*" multiple><p id="n" class="note">Todavía no elegiste fotos.</p><label class="cover"><input id="cover" type="checkbox" checked> Usar la primera como portada</label><button id="go">Subir todas las fotos</button><p id="s" class="status"></p><p><a href="./" style="color:#ff956d">← Volver al administrador</a></p></main><script>const O='dpacatalogodigital',R='catalogo-dpa',B='main',$=x=>document.getElementById(x);let cars=[];function say(x){s.textContent=x;s.className='status on'}function find(o){if(!o||typeof o!=='object')return'';for(const k of ['token','access_token','accessToken'])if(typeof o[k]==='string'&&o[k].length>12)return o[k];for(const k in o){const x=find(o[k]);if(x)return x}return''}function token(){for(let i=0;i<localStorage.length;i++){try{const x=find(JSON.parse(localStorage.getItem(localStorage.key(i))));if(x)return x}catch(e){}}return''}async function api(p,t,o={}){const r=await fetch('https://api.github.com'+p,{...o,headers:{Accept:'application/vnd.github+json',Authorization:t.startsWith('Bearer ')?t:'Bearer '+t,'Content-Type':'application/json'}});if(!r.ok){let x='';try{x=(await r.json()).message}catch(e){}throw Error(x||'GitHub no pudo guardar las fotos.')}return r.json()}async function b64(a){const u=new Uint8Array(await a.arrayBuffer());let x='';for(let i=0;i<u.length;i+=30000)x+=String.fromCharCode(...u.slice(i,i+30000));return btoa(x)}function dec(x){return new TextDecoder().decode(Uint8Array.from(atob(x.replace(/\n/g,'')),z=>z.charCodeAt(0)))}function enc(x){const u=new TextEncoder().encode(x);let s='';for(let i=0;i<u.length;i+=30000)s+=String.fromCharCode(...u.slice(i,i+30000));return btoa(s)}function name(x,i){return x.replace(/[^a-z0-9.]+/gi,'-').replace(/-+/g,'-').toLowerCase().slice(0,70)+'-'+Date.now()+'-'+i}async function load(){const r=await fetch('../cars.json?x='+Date.now());const d=await r.json();cars=Array.isArray(d)?d:(d.vehiculos||[]);v.innerHTML=cars.map((a,i)=>'<option value="'+i+'">'+a.marca+' '+a.modelo+' · '+(a.anio||'')+'</option>').join('')}f.onchange=()=>n.textContent=f.files.length?f.files.length+' foto'+(f.files.length==1?'':'s')+' seleccionada'+(f.files.length==1?'':'s')+'.':'Todavía no elegiste fotos.';go.onclick=async()=>{const fs=[...f.files],t=token(),a=cars[Number(v.value)];if(!fs.length||!a){say('Elegí un vehículo y las fotos.');return}if(!t){say('Volvé al administrador, iniciá sesión con GitHub y abrí esta página de nuevo.');return}go.disabled=true;try{const cur=await api('/repos/'+O+'/'+R+'/contents/cars.json?ref='+B,t),d=JSON.parse(dec(cur.content)),list=Array.isArray(d)?d:d.vehiculos,target=list.find(x=>String(x.id)===String(a.id)),urls=[];for(let i=0;i<fs.length;i++){say('Subiendo foto '+(i+1)+' de '+fs.length+'…');const p='imagenes/vehiculos/'+name(fs[i].name,i);await api('/repos/'+O+'/'+R+'/contents/'+p,t,{method:'PUT',body:JSON.stringify({message:'Agregar foto de vehículo',content:await b64(fs[i]),branch:B})});urls.push('/catalogo-dpa/'+p)}target.imagenes=[...(target.imagenes||[]),...urls];if(cover.checked)target.portada=urls[0];say('Guardando el vehículo…');await api('/repos/'+O+'/'+R+'/contents/cars.json',t,{method:'PUT',body:JSON.stringify({message:'Agregar lote de '+fs.length+' fotos',content:enc(JSON.stringify(d,null,2)+'\n'),sha:cur.sha,branch:B})});say('Listo: se cargaron '+fs.length+' fotos. El catálogo se actualiza en menos de un minuto.');f.value='';n.textContent='Todavía no elegiste fotos.'}catch(e){say('Error: '+e.message)}go.disabled=false};load().catch(e=>say('Error: '+e.message));</script></html>
