<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carga de fotos | DPA</title><style>body{margin:0;background:#101114;color:#fff;font:16px Arial}.w{max-width:720px;margin:auto;padding:40px 20px}.c{margin-top:24px;padding:24px;border:1px solid #383940;border-radius:16px;background:#1b1c21}select,button{font:inherit;padding:13px;border-radius:9px}select{width:100%;background:#111217;color:#fff;border:1px solid #555}.drop{margin-top:20px;padding:42px 15px;border:2px dashed #f15a24;border-radius:14px;text-align:center;cursor:pointer}.drop.drag{background:#3a2419}button{border:0;margin:18px 8px 0 0;font-weight:bold;cursor:pointer}.a{background:#f15a24;color:#fff}.b{background:#3d4049;color:#fff}.status{margin-top:18px;color:#ffc99f}.ok{color:#a4f1b3}li{padding:7px 0;color:#ddd}</style></head><body><main class="w"><h1>Cargar fotos de un auto</h1><p>Elegí el auto y arrastrá todas sus fotos juntas. Las fotos que ya tiene el catálogo no se borran.</p><section class="c"><label>Auto</label><select id="car" disabled><option>Cargando…</option></select><input id="files" type="file" accept="image/*" multiple hidden><div id="drop" class="drop"><b>Arrastrá aquí todas las fotos</b><br><small>o hacé clic para elegir varias desde tu computadora</small></div><ul id="list"></ul><button id="login" class="b">Iniciar sesión con GitHub</button><button id="send" class="a" disabled>Publicar fotos</button><div id="status" class="status"></div></section></main><script>
const repo='dpacatalogodigital/catalogo-dpa',branch='main',auth='https://dpa-decap-auth.redesdpa2023.workers.dev/auth';let token='',data,files=[];const q=x=>document.getElementById(x),say=(x,ok=false)=>{q('status').textContent=x;q('status').className='status '+(ok?'ok':'')};const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));const decode=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),x=>x.charCodeAt(0)));async function api(path,opt={}){let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,...(opt.headers||{})}});if(!r.ok)throw Error((await r.json().catch(()=>({message:r.statusText}))).message);return r.json()}function can(){q('send').disabled=!(token&&q('car').value&&files.length)}async function init(){try{data=await fetch('../cars.json?x='+Date.now()).then(x=>x.json());let a=Array.isArray(data)?data:data.vehiculos||[];q('car').innerHTML='<option value="">Elegí un auto</option>'+a.filter(x=>x.marca&&x.modelo).map(x=>'<option value="'+x.id+'">'+x.marca+' — '+x.modelo+' ('+(x.anio||'')+')</option>').join('');q('car').disabled=false}catch(e){say('No se pudieron cargar los autos. Actualizá la página.')}}function show(v){files=[...v].filter(f=>f.type.startsWith('image/'));q('list').innerHTML=files.map(f=>'<li>'+f.name+'</li>').join('');say(files.length+' foto'+(files.length===1?' seleccionada':'s seleccionadas')+'.');can()}q('files').onchange=e=>show(e.target.files);q('car').onchange=can;q('drop').onclick=()=>q('files').click();['dragenter','dragover'].forEach(n=>q('drop').addEventListener(n,e=>{e.preventDefault();q('drop').classList.add('drag')}));['dragleave','drop'].forEach(n=>q('drop').addEventListener(n,e=>{e.preventDefault();q('drop').classList.remove('drag')}));q('drop').addEventListener('drop',e=>show(e.dataTransfer.files));function getToken(d){if(typeof d==='object')return d.token||d.access_token||'';let p='authorization:github:success:';if(typeof d!=='string'||!d.startsWith(p))return '';let v=d.slice(p.length);try{return (JSON.parse(v).token||JSON.parse(v).access_token||'')}catch{return v.replace(/^"|"$/g,'')}}window.addEventListener('message',e=>{let t=getToken(e.data);if(t){token=t;q('login').textContent='Sesión iniciada';say('Sesión lista.',true);can()}});q('login').onclick=()=>window.open(auth,'dpa-auth','width=600,height=700');function file64(f){return f.arrayBuffer().then(b=>{let a=new Uint8Array(b),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)})}function clean(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'-')}q('send').onclick=async()=>{try{q('send').disabled=true;let a=Array.isArray(data)?data:data.vehiculos,car=a.find(x=>String(x.id)===q('car').value),paths=[];for(let i=0;i<files.length;i++){let path='imagenes/vehiculos/'+Date.now()+'-'+i+'-'+clean(files[i].name);say('Subiendo '+(i+1)+' de '+files.length+'…');await api('/repos/'+repo+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Agregar foto de '+car.modelo,content:await file64(files[i]),branch})});paths.push('/'+path)}let current=await api('/repos/'+repo+'/contents/cars.json?ref='+branch),json=JSON.parse(decode(current.content)),all=Array.isArray(json)?json:json.vehiculos,target=all.find(x=>String(x.id)===q('car').value);target.imagenes=[...(Array.isArray(target.imagenes)?target.imagenes:[]),...paths];await api('/repos/'+repo+'/contents/cars.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Agregar fotos a '+target.modelo,content:b64(JSON.stringify(json,null,2)+'\n'),sha:current.sha,branch})});say('Listo. Las fotos se publicaron; el catálogo se actualiza en alrededor de un minuto.',true);files=[];q('list').innerHTML=''}catch(e){say('No se pudo publicar: '+e.message);can()}};init();
</script></body></html>
