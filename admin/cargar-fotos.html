<!doctype html><meta charset="utf-8"><title>Subir fotos | DPA</title><style>body{font:16px Arial;max-width:680px;margin:40px auto;padding:20px;background:#17171a;color:#fff}select,input,button{display:block;width:100%;box-sizing:border-box;margin:16px 0;padding:14px;font:inherit}button{background:#f15a24;color:#fff;border:0;font-weight:bold}small{color:#ccc}</style><h1>Subir varias fotos</h1><p>Elegí un auto y seleccioná todas sus fotos juntas.</p><select id="c"><option>Cargando autos…</option></select><input id="f" type="file" accept="image/*" multiple><small id="s">Usa la sesión de GitHub que ya abriste en el administrador.</small><button id="b">Publicar fotos</button><script>const R='dpacatalogodigital/catalogo-dpa',B='main',q=x=>document.getElementById(x);let cars,token;function tok(){for(let i=0;i<localStorage.length;i++){let v=localStorage.getItem(localStorage.key(i));try{let j=JSON.parse(v);if(j.token)return j.token;if(j.access_token)return j.access_token}catch(e){}}}async function api(p,o={}){let r=await fetch('https://api.github.com'+p,{...o,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json',...(o.headers||{})}});if(!r.ok)throw Error((await r.json()).message);return r.json()}function enc(t){let a=new TextEncoder().encode(t),s='';for(let i=0;i<a.length;i+=30000)s+=String.fromCharCode(...a.slice(i,i+30000));return btoa(s)}function dec(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),x=>x.charCodeAt(0)))}async function file(f){let a=new Uint8Array(await f.arrayBuffer()),s='';for(let i=0;i<a.length;i+=30000)s+=String.fromCharCode(...a.slice(i,i+30000));return btoa(s)}async function start(){token=tok();if(!token){q('s').textContent='Abrí el administrador, iniciá sesión con GitHub y volvé aquí.';q('b').disabled=true;return}cars=await fetch('../cars.json?'+Date.now()).then(r=>r.json());q('c').innerHTML='<option value="">Elegí un auto</option>'+cars.filter(a=>a.marca&&a.modelo).map(a=>'<option value="'+a.id+'">'+a.marca+' — '+a.modelo+'</option>').join('');q('s').textContent='Sesión lista: podés seleccionar muchas fotos de una vez.'}q('b').onclick=async()=>{try{let car=cars.find(a=>a.id==q('c').value),fs=[...q('f').files];if(!car||!fs.length)throw Error('Elegí un auto y las fotos');q('b').disabled=true;let ps=[];for(let i=0;i<fs.length;i++){q('s').textContent='Subiendo '+(i+1)+' de '+fs.length+'…';let p='imagenes/vehiculos/'+Date.now()+'-'+i+'-'+fs[i].name.replace(/[^\w.-]/g,'-');await api('/repos/'+R+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Agregar foto',content:await file(fs[i]),branch:B})});ps.push('/'+p)}let cur=await api('/repos/'+R+'/contents/cars.json?ref='+B),all=JSON.parse(dec(cur.content)),x=all.find(a=>a.id==car.id);x.imagenes=[...(x.imagenes||[]),...ps];await api('/repos/'+R+'/contents/cars.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Agregar fotos',content:enc(JSON.stringify(all,null,2)+'\n'),sha:cur.sha,branch:B})});q('s').textContent='Listo. El catálogo se actualiza en un minuto.'}catch(e){q('s').textContent='Error: '+e.message;q('b').disabled=false}};start()</script>
