<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DPA | Vehículos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Montserrat,Arial,sans-serif;background:#0b0b0d;color:#fff}.hero{min-height:48vh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:0}.hero-fachada{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 58%;display:block}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.68))}.hero-content{position:relative;z-index:2;width:100%;max-width:850px;padding:60px 20px}.logo-imagen{width:min(520px,85vw);max-height:220px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.65))}.hero p{margin-top:14px;color:#fff;font-size:15px;text-shadow:0 2px 10px #000}.seccion{padding:70px 20px 85px}.seccion-alterna{background:#101012}.contenedor{max-width:1250px;margin:auto}.titulo{text-align:center;margin-bottom:42px}.titulo h2{font-size:clamp(30px,5vw,48px);font-weight:800}.titulo h2:after{content:'';display:block;width:70px;height:4px;background:#f15a24;margin:16px auto;border-radius:5px}.titulo p{color:#bdbdbd;font-size:14px}.carousel{position:relative;overflow:hidden}.track{display:flex;gap:24px;transition:transform .4s}.track .card{flex:0 0 calc(25% - 18px)}.card{background:#17171a;border:1px solid #29292d;border-radius:18px;overflow:hidden}.card-image{height:270px;background:#101012;position:relative}.card-image img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:14px;left:14px;background:#f15a24;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:800}.card-info{padding:22px}.marca{color:#f15a24;font-size:12px;font-weight:800;letter-spacing:1.5px;margin-bottom:8px}.modelo{font-size:20px;font-weight:700;margin-bottom:14px}.datos{color:#c7c7c7;font-size:13px;line-height:1.6;min-height:42px}.ficha,.contacto{border:1px solid #f15a24;color:#fff;background:transparent;border-radius:8px;padding:11px 17px;font:700 12px Montserrat;cursor:pointer;margin-top:18px}.ficha:hover,.contacto{background:#f15a24}.arrow{position:absolute;top:43%;width:46px;height:46px;border:0;border-radius:50%;background:#f15a24;color:#fff;font-size:25px;font-weight:bold;cursor:pointer;z-index:3}.prev{left:10px}.next{right:10px}.dots{display:flex;justify-content:center;gap:8px;margin-top:28px}.dot{width:9px;height:9px;border:0;border-radius:50%;background:#555}.dot.active{width:25px;border-radius:10px;background:#f15a24}.busqueda{max-width:650px;margin:0 auto 35px}.busqueda input{width:100%;padding:17px 22px;background:#17171a;border:1px solid #36363b;border-radius:12px;color:#fff;font:14px Montserrat;outline:0}.busqueda input:focus{border-color:#f15a24}.filtros{margin-bottom:42px}.filtro-titulo{text-align:center;font-size:13px;font-weight:800;letter-spacing:1.5px;margin:20px 0 15px}.filtros-lista{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.filtro{padding:10px 16px;border:1px solid #36363b;background:#17171a;color:#ccc;border-radius:25px;font:700 12px Montserrat;cursor:pointer}.filtro.activo,.filtro:hover{background:#f15a24;border-color:#f15a24;color:#fff}.resultados-info{text-align:center;color:#999;font-size:13px;margin-bottom:35px}.catalogo-grupo{margin-bottom:65px}.grupo-titulo{display:flex;align-items:center;gap:15px;margin-bottom:25px}.grupo-titulo h3{font-size:24px}.grupo-titulo span{color:#888;font-size:12px}.grupo-titulo:after{content:'';height:1px;flex:1;background:#29292d}.catalogo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.mensaje-catalogo{text-align:center;padding:50px 20px;color:#999}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;overflow:auto;padding:30px 15px}.modal.activo{display:flex;align-items:center;justify-content:center}.modal-contenido{position:relative;width:100%;max-width:1050px;background:#151518;border:1px solid #29292d;border-radius:20px;overflow:hidden}.cerrar{position:absolute;top:15px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:27px;cursor:pointer;z-index:5}.galeria-principal{height:600px;background:#080809}.galeria-principal img{width:100%;height:100%;object-fit:contain}.galeria-miniaturas{display:flex;gap:10px;padding:14px;overflow:auto;background:#101012}.galeria-miniaturas img{width:90px;height:65px;object-fit:cover;border-radius:7px;opacity:.6;border:2px solid transparent}.galeria-miniaturas img.activa{opacity:1;border-color:#f15a24}.ficha-contenido{padding:30px}.ficha-marca{color:#f15a24;font-size:13px;font-weight:800;letter-spacing:2px}.ficha-modelo{margin-top:8px;font-size:clamp(28px,5vw,45px);font-weight:800}.ficha-datos,.ficha-descripcion{margin-top:18px;color:#cfcfcf;line-height:1.8;font-size:14px}.ficha-precio{margin-top:25px;font-size:27px;font-weight:800}.contacto{display:inline-block;text-decoration:none}.footer{text-align:center;padding:45px 20px;border-top:1px solid #252529;color:#888;font-size:12px}
@media(max-width:1000px){.track .card{flex-basis:calc(50% - 12px)}.catalogo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.hero{min-height:42vh}.hero-fachada{object-position:center 55%}.hero-content{padding:45px 15px}.seccion{padding:55px 15px 65px}.track .card{flex-basis:100%}.catalogo-grid{grid-template-columns:1fr}.card-image{height:250px}.galeria-principal{height:350px}}
</style></head><body>
<header class="hero"><img class="hero-fachada" src="fachada-dpa-bg.jpg?v=3" alt="DPA da Ponte Automotores"><div class="hero-content"><img src="logo-dpa.png?v=4" alt="da Ponte Automotores" class="logo-imagen"><p>Vehículos seleccionados · Calidad y trayectoria</p></div></header>
<section class="seccion seccion-alterna"><div class="contenedor"><div class="titulo"><h2>RECIÉN LLEGADOS</h2><p>Conocé los vehículos incorporados recientemente al catálogo.</p></div><div class="carousel"><button class="arrow prev" id="prevBtn">‹</button><div class="track" id="recentTrack"></div><button class="arrow next" id="nextBtn">›</button></div><div class="dots" id="dots"></div></div></section>
<section class="seccion" id="catalogo"><div class="contenedor"><div class="titulo"><h2>CATÁLOGO</h2><p>Encontrá tu próximo vehículo por marca o tipo.</p></div><div class="busqueda"><input id="buscador" type="search" placeholder="Buscar marca, modelo o palabra clave..."></div><div class="filtros"><div class="filtro-titulo">MARCA</div><div class="filtros-lista" id="filtrosMarca"></div><div class="filtro-titulo">TIPO</div><div class="filtros-lista" id="filtrosTipo"></div></div><div class="resultados-info" id="resultadosInfo"></div><div id="catalogoContenido"></div></div></section>
<div class="modal" id="modal"><div class="modal-contenido"><button class="cerrar" id="cerrar">×</button><div class="galeria-principal"><img id="modalImagen" src="" alt=""></div><div class="galeria-miniaturas" id="miniaturas"></div><div class="ficha-contenido"><div class="ficha-marca" id="modalMarca"></div><div class="ficha-modelo" id="modalModelo"></div><div class="ficha-datos" id="modalDatos"></div><div class="ficha-descripcion" id="modalDescripcion"></div><div class="ficha-precio" id="modalPrecio"></div><a class="contacto" href="https://sites.google.com/view/catalogo-digital-dpa/inicio/cont%C3%A1ctanos?authuser=4" target="_blank" rel="noopener">CONTACTAR CON DPA →</a></div></div></div>
<footer class="footer">DPA · 16 años de trayectoria</footer>
<script>
const MARCAS=['AUDI','BMW','CHEVROLET','CITROËN','FIAT','FORD','JEEP','MERCEDES','MINI','NISSAN','PEUGEOT','DODGE-RAM','RENAULT','TOYOTA','VOLKSWAGEN'],TIPOS=['HATCHBACK','SEDÁN','PICK-UP','FURGÓN-UTILITARIO','SUV','RURAL','COUPÉ','CABRIOLET','0KM'];let autos=[],marcaActiva='TODAS',tipoActivo='TODOS',busqueda='',slide=0;const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();function marcaNorm(s){let n=norm(s);return n==='CITROEN'?'CITROËN':n==='DODGE RAM'||n==='DODGE/RAM'?'DODGE-RAM':n}function tipoNorm(a){let n=norm(a.tipo);return n==='HATCH'||n==='HATCHBACK'?'HATCHBACK':n==='PICKUP'||n==='PICK-UP'?'PICK-UP':n==='FURGON'||n==='FURGON-UTILITARIO'||n==='FURGON UTILITARIO'?'FURGÓN-UTILITARIO':n}function es0km(a){return /0KM|CERO\s*KILOMETR|NUEVO/.test(norm([a.tipo,a.condicion,a.estado,a.km,a.kilometros,a['0km'],a.ceroKm,a.ceroKM].join(' ')))}function tarjeta(a){return `<article class="card"><div class="card-image"><img src="${a.imagenes?.[0]||'logo-dpa.png'}" alt="${a.marca} ${a.modelo}" loading="lazy">${a.sale?'<span class="badge">OFERTA</span>':''}</div><div class="card-info"><div class="marca">${a.marca}</div><div class="modelo">${a.modelo}</div><div class="datos">${a.anio?`Año ${a.anio} · `:''}${a.datos||''}</div><button class="ficha" onclick="abrirFicha(${a.id})">VER FICHA →</button></div></article>`}function filtros(){document.getElementById('filtrosMarca').innerHTML=['TODAS',...MARCAS].map(x=>`<button class="filtro ${marcaActiva===x?'activo':''}" onclick="setMarca('${x}')">${x}</button>`).join('');document.getElementById('filtrosTipo').innerHTML=['TODOS',...TIPOS].map(x=>`<button class="filtro ${tipoActivo===x?'activo':''}" onclick="setTipo('${x}')">${x}</button>`).join('')}function setMarca(x){marcaActiva=x;render()}function setTipo(x){tipoActivo=x;render()}function filtrados(){return autos.filter(a=>{let m=marcaActiva==='TODAS'||marcaNorm(a.marca)===marcaActiva,t=tipoActivo==='TODOS'||(tipoActivo==='0KM'?es0km(a):tipoNorm(a)===tipoActivo),q=norm(busqueda),txt=norm(`${a.marca} ${a.modelo} ${a.tipo} ${a.datos} ${a.anio} ${a.descripcion}`);return m&&t&&(!q||txt.includes(q))})}function render(){filtros();let l=filtrados(),c=document.getElementById('catalogoContenido');document.getElementById('resultadosInfo').textContent=`${l.length} vehículo${l.length===1?'':'s'} disponible${l.length===1?'':'s'}`;if(!l.length){c.innerHTML='<div class="mensaje-catalogo">No hay vehículos que coincidan con los filtros seleccionados.</div>';return}let orden=MARCAS.filter(m=>l.some(a=>marcaNorm(a.marca)===m));c.innerHTML=orden.map(m=>{let arr=l.filter(a=>marcaNorm(a.marca)===m);return `<div class="catalogo-grupo"><div class="grupo-titulo"><h3>${m}</h3><span>${arr.length} vehículo${arr.length===1?'':'s'}</span></div><div class="catalogo-grid">${arr.map(tarjeta).join('')}</div></div>`}).join('')}function recientes(){let r=autos.filter(a=>a.recienLlegado),t=document.getElementById('recentTrack');t.innerHTML=r.map(tarjeta).join('');document.getElementById('dots').innerHTML=r.map((_,i)=>`<button class="dot ${i?'':'active'}" onclick="irSlide(${i})"></button>`).join('');slide=0;actualizarSlide()}function actualizarSlide(){let t=document.getElementById('recentTrack');if(!t.children.length)return;let v=innerWidth<=600?1:innerWidth<=1000?2:4,max=Math.max(0,t.children.length-v);slide=Math.max(0,Math.min(slide,max));t.style.transform=`translateX(-${slide*(t.children[0].getBoundingClientRect().width+24)}px)`;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===slide))}function irSlide(i){slide=i;actualizarSlide()}document.getElementById('prevBtn').onclick=()=>{slide--;actualizarSlide()};document.getElementById('nextBtn').onclick=()=>{slide++;actualizarSlide()};window.addEventListener('resize',actualizarSlide);function abrirFicha(id){let a=autos.find(x=>x.id===id);if(!a)return;modalMarca.textContent=a.marca;modalModelo.textContent=a.modelo;modalDatos.textContent=[a.anio&&`Año ${a.anio}`,a.tipo,a.datos].filter(Boolean).join(' · ');modalDescripcion.textContent=a.descripcion||'';modalPrecio.textContent=a.precio||'Consultar';let imgs=a.imagenes?.length?a.imagenes:['logo-dpa.png'];modalImagen.src=imgs[0];miniaturas.innerHTML=imgs.map((x,i)=>`<img src="${x}" class="${i?'':'activa'}" onclick="cambiarImagen('${x}',this)" alt="">`).join('');modal.classList.add('activo');document.body.style.overflow='hidden'}function cambiarImagen(src,e){modalImagen.src=src;document.querySelectorAll('.galeria-miniaturas img').forEach(x=>x.classList.remove('activa'));e.classList.add('activa')}function cerrar(){modal.classList.remove('activo');document.body.style.overflow=''}document.getElementById('cerrar').onclick=cerrar;document.getElementById('modal').onclick=e=>{if(e.target===document.getElementById('modal'))cerrar()};document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});document.getElementById('buscador').oninput=e=>{busqueda=e.target.value;render()};fetch('cars.json?v=7').then(r=>r.json()).then(d=>{autos=Array.isArray(d)?d:[];render();recientes()}).catch(()=>document.getElementById('catalogoContenido').innerHTML='<div class="mensaje-catalogo">No se pudo cargar el catálogo.</div>');
</script></body></html>
