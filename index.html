<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DPA Automotores | Catálogo Digital</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',Arial,sans-serif;
    background:#0b0b0d;
    color:#fff;
}

/* =========================
   HEADER
========================= */

.hero{
    min-height:42vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 20px;
    background:
        radial-gradient(circle at center,#29292f 0%,#151518 35%,#0b0b0d 72%);
}

.hero-content{
    max-width:900px;
}

.logo-text{
    font-size:clamp(55px,10vw,105px);
    font-weight:800;
    letter-spacing:-7px;
    line-height:.9;
}

.logo-text span{
    color:#f15a24;
}

.hero h1{
    margin-top:18px;
    font-size:clamp(30px,5vw,55px);
    font-weight:700;
}

.hero p{
    margin-top:16px;
    color:#cfcfcf;
    font-size:15px;
}

/* =========================
   FILTROS
========================= */

.filtros{
    padding:35px 20px;
    background:#111114;
    border-top:1px solid #252529;
    border-bottom:1px solid #252529;
}

.filtros-contenedor{
    max-width:1250px;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
}

.filtro{
    background:#1b1b1f;
    color:#fff;
    border:1px solid #34343a;
    border-radius:8px;
    padding:13px 16px;
    font-family:inherit;
    font-size:13px;
    outline:none;
    cursor:pointer;
}

.filtro:focus{
    border-color:#f15a24;
}

.filtro option{
    background:#1b1b1f;
}

/* =========================
   SECCIONES
========================= */

.seccion{
    padding:70px 20px 85px;
}

.contenedor{
    max-width:1250px;
    margin:auto;
}

.titulo{
    text-align:center;
    margin-bottom:42px;
}

.titulo h2{
    font-size:clamp(30px,5vw,48px);
    font-weight:800;
    letter-spacing:1px;
}

.titulo h2::after{
    content:"";
    display:block;
    width:70px;
    height:4px;
    background:#f15a24;
    margin:16px auto 0;
    border-radius:5px;
}

.titulo p{
    color:#aaa;
    margin-top:16px;
    font-size:14px;
}

/* =========================
   MARCAS
========================= */

.marcas{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:55px;
}

.marca-btn{
    padding:11px 18px;
    background:#17171a;
    border:1px solid #2c2c31;
    color:#ddd;
    border-radius:30px;
    cursor:pointer;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    transition:.25s;
}

.marca-btn:hover,
.marca-btn.activa{
    background:#f15a24;
    border-color:#f15a24;
    color:#fff;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:24px;
}

/* =========================
   TARJETA
========================= */

.card{
    background:#17171a;
    border:1px solid #29292d;
    border-radius:18px;
    overflow:hidden;
    transition:.35s ease;
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 18px 45px rgba(0,0,0,.45);
}

.card-image{
    position:relative;
    height:270px;
    overflow:hidden;
    background:#09090b;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.5s ease;
}

.card:hover .card-image img{
    transform:scale(1.04);
}

.badge{
    position:absolute;
    top:14px;
    left:14px;
    background:#f15a24;
    color:#fff;
    font-size:10px;
    font-weight:800;
    padding:7px 11px;
    border-radius:20px;
    letter-spacing:.5px;
    z-index:2;
}

.card-info{
    padding:21px;
}

.marca{
    color:#f15a24;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.modelo{
    font-size:19px;
    line-height:1.3;
    font-weight:700;
    margin-bottom:12px;
}

.datos{
    color:#bdbdbd;
    font-size:12px;
    line-height:1.6;
    min-height:40px;
}

.precio{
    margin-top:14px;
    font-size:19px;
    font-weight:800;
}

.boton-ficha{
    width:100%;
    margin-top:18px;
    padding:12px;
    background:transparent;
    border:1px solid #f15a24;
    color:#fff;
    border-radius:8px;
    font-family:inherit;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.boton-ficha:hover{
    background:#f15a24;
}

/* =========================
   SIN RESULTADOS
========================= */

.sin-resultados{
    text-align:center;
    padding:60px 20px;
    color:#888;
    display:none;
}

/* =========================
   MODAL / FICHA
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    z-index:1000;
    display:none;
    overflow-y:auto;
    padding:30px 15px;
}

.modal.activo{
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.modal-contenido{
    width:100%;
    max-width:1100px;
    background:#151518;
    border:1px solid #303035;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    margin:auto;
}

.cerrar{
    position:absolute;
    top:15px;
    right:15px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    color:#fff;
    font-size:24px;
    cursor:pointer;
    z-index:20;
}

.cerrar:hover{
    background:#f15a24;
}

/* =========================
   GALERIA
========================= */

.galeria-principal{
    width:100%;
    height:min(70vh,650px);
    background:#050506;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/*
   IMPORTANTE:
   contain evita que las fotos del vehículo
   sean recortadas.
*/

.galeria-principal img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#050506;
    display:block;
}

.galeria-flecha{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:rgba(241,90,36,.9);
    color:#fff;
    font-size:28px;
    cursor:pointer;
    z-index:10;
}

.galeria-flecha:hover{
    background:#ff6a30;
}

.galeria-anterior{
    left:18px;
}

.galeria-siguiente{
    right:18px;
}

.miniaturas{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px;
    background:#0d0d0f;
}

.miniaturas img{
    width:80px;
    height:58px;
    object-fit:cover;
    border-radius:6px;
    cursor:pointer;
    opacity:.6;
    border:2px solid transparent;
}

.miniaturas img.activa{
    opacity:1;
    border-color:#f15a24;
}

/* =========================
   INFORMACION FICHA
========================= */

.detalle{
    padding:30px;
}

.detalle-marca{
    color:#f15a24;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:8px;
}

.detalle-titulo{
    font-size:clamp(25px,4vw,40px);
    font-weight:800;
    margin-bottom:20px;
}

.detalle-datos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:25px;
}

.dato{
    background:#1d1d21;
    border:1px solid #2b2b30;
    border-radius:10px;
    padding:15px;
}

.dato small{
    display:block;
    color:#888;
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:5px;
}

.dato strong{
    font-size:13px;
}

.detalle-descripcion{
    color:#bbb;
    line-height:1.7;
    font-size:13px;
    margin-bottom:25px;
}

.contacto{
    display:inline-block;
    padding:14px 22px;
    background:#f15a24;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:12px;
    font-weight:800;
}

.contacto:hover{
    background:#ff6a30;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    padding:45px 20px;
    border-top:1px solid #252529;
    color:#777;
    font-size:12px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .detalle-datos{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    .hero{
        min-height:35vh;
        padding:45px 18px;
    }

    .logo-text{
        letter-spacing:-4px;
    }

    .seccion{
        padding:55px 15px 65px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:18px;
    }

    .card-image{
        height:290px;
    }

    .detalle{
        padding:22px;
    }

    .detalle-datos{
        grid-template-columns:1fr 1fr;
    }

    .galeria-principal{
        height:55vh;
    }

}
</style>
</head>

<body>

<!-- =========================
     HERO
========================= -->

<header class="hero">

    <div class="hero-content">

        <div class="logo-text">
            d<span>p</span>a
        </div>

        <h1>Automotores</h1>

        <p>
            Vehículos seleccionados · Confianza · Experiencia
        </p>

    </div>

</header>


<!-- =========================
     FILTROS
========================= -->

<section class="filtros">

    <div class="filtros-contenedor">

        <select id="filtroMarca" class="filtro">
            <option value="">Todas las marcas</option>
        </select>

        <select id="filtroTipo" class="filtro">
            <option value="">Todos los tipos</option>
        </select>

        <select id="filtroAnio" class="filtro">
            <option value="">Todos los años</option>
        </select>

        <select id="filtroCondicion" class="filtro">
            <option value="">Todos los vehículos</option>
            <option value="usado">Usados</option>
            <option value="0km">0 KM</option>
        </select>

        <button
            class="filtro"
            onclick="limpiarFiltros()">
            LIMPIAR FILTROS
        </button>

    </div>

</section>


<!-- =========================
     CATALOGO
========================= -->

<main class="seccion">

    <div class="contenedor">

        <div class="titulo">

            <h2>CATÁLOGO</h2>

            <p>
                Encontrá el vehículo que estás buscando
            </p>

        </div>


        <!-- MARCAS -->

        <div
            id="marcas"
            class="marcas">
        </div>


        <!-- VEHICULOS -->

        <div
            id="gridVehiculos"
            class="grid">
        </div>


        <div
            id="sinResultados"
            class="sin-resultados">

            No encontramos vehículos con esos filtros.

        </div>

    </div>

</main>


<!-- =========================
     MODAL
========================= -->

<div
    id="modal"
    class="modal">

    <div class="modal-contenido">

        <button
            class="cerrar"
            onclick="cerrarFicha()">
            ×
        </button>


        <div class="galeria-principal">

            <button
                class="galeria-flecha galeria-anterior"
                onclick="fotoAnterior()">
                ‹
            </button>

            <img
                id="fotoPrincipal"
                src=""
                alt="Vehículo">

            <button
                class="galeria-flecha galeria-siguiente"
                onclick="fotoSiguiente()">
                ›
            </button>

        </div>


        <div
            id="miniaturas"
            class="miniaturas">
        </div>


        <div class="detalle">

            <div
                id="detalleMarca"
                class="detalle-marca">
            </div>

            <div
                id="detalleTitulo"
                class="detalle-titulo">
            </div>


            <div
                id="detalleDatos"
                class="detalle-datos">
            </div>


            <div
                id="detalleDescripcion"
                class="detalle-descripcion">
            </div>


            <a
                id="botonContacto"
                class="contacto"
                href="https://sites.google.com/view/catalogo-digital-dpa/inicio?authuser=4"
                target="_blank">

                CONSULTAR POR ESTE VEHÍCULO →

            </a>

        </div>

    </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    DPA Automotores · 16 años de trayectoria

</footer>


<script>

/*
====================================================
BASE DE VEHICULOS
====================================================

Esta es la parte que posteriormente vamos a convertir
en cars.json.

Para agregar un vehículo se agrega otro objeto dentro
de la lista "vehiculos".
====================================================
*/

const vehiculos = [

    {
        id:1,

        marca:"MINI",

        modelo:"Cooper S 1.6 Turbo",

        tipo:"Hatch",

        anio:"2008",

        condicion:"usado",

        datos:"175 CV · Nafta · Manual",

        precio:"Consultar",

        imagenes:[
            "mini.jpeg"
        ],

        descripcion:
        "Mini Cooper S 1.6 Turbo de 175 CV. Vehículo compacto, deportivo y con excelente equipamiento."
    },


    {
        id:2,

        marca:"VOLKSWAGEN",

        modelo:"Amarok 2.0 TDI Highline",

        tipo:"Pick-Up",

        anio:"2013",

        condicion:"usado",

        datos:"4x4 · 180 CV · Diésel",

        precio:"Consultar",

        imagenes:[
            "amarok.jpeg"
        ],

        descripcion:
        "Volkswagen Amarok 2.0 TDI Highline 4x4. Pick-up de gran capacidad, confort y prestaciones."
    },


    {
        id:3,

        marca:"TOYOTA",

        modelo:"Hilux 2.4 TDi 4x2 DX",

        tipo:"Pick-Up",

        anio:"2018",

        condicion:"usado",

        datos:"4x2 · Diésel · Caja manual",

        precio:"Consultar",

        imagenes:[
            "hilux.jpeg"
        ],

        descripcion:
        "Toyota Hilux 2.4 TDi 4x2 DX. Una pick-up reconocida por su confiabilidad y robustez."
    },


    {
        id:4,

        marca:"FORD",

        modelo:"Ranger 2.0 XLT Bi-Turbo",

        tipo:"Pick-Up",

        anio:"2024",

        condicion:"usado",

        datos:"4x2 AT10 · Bi-Turbo · Automática",

        precio:"Consultar",

        imagenes:[
            "ranger.jpeg"
        ],

        descripcion:
        "Ford Ranger 2.0 XLT Bi-Turbo. Línea 2023, año 2024. Excelente combinación de tecnología, potencia y confort."
    }

];


/*
====================================================
VARIABLES
====================================================
*/

let vehiculoActual = null;

let fotoActual = 0;


/*
====================================================
INICIAR
====================================================
*/

document.addEventListener(
    "DOMContentLoaded",
    function(){

        cargarFiltros();

        mostrarVehiculos();

    }
);


/*
====================================================
CARGAR FILTROS
====================================================
*/

function cargarFiltros(){

    const marcas =
        [...new Set(
            vehiculos.map(v => v.marca)
        )].sort();


    const tipos =
        [...new Set(
            vehiculos.map(v => v.tipo)
        )].sort();


    const anios =
        [...new Set(
            vehiculos.map(v => v.anio)
        )].sort(
            (a,b) => b-a
        );


    const filtroMarca =
        document.getElementById("filtroMarca");


    const filtroTipo =
        document.getElementById("filtroTipo");


    const filtroAnio =
        document.getElementById("filtroAnio");


    marcas.forEach(
        marca => {

            const option =
                document.createElement("option");

            option.value = marca;

            option.textContent = marca;

            filtroMarca.appendChild(option);

        }
    );


    tipos.forEach(
        tipo => {

            const option =
                document.createElement("option");

            option.value = tipo;

            option.textContent = tipo;

            filtroTipo.appendChild(option);

        }
    );


    anios.forEach(
        anio => {

            const option =
                document.createElement("option");

            option.value = anio;

            option.textContent = anio;

            filtroAnio.appendChild(option);

        }
    );


    document
        .querySelectorAll(".filtro")
        .forEach(
            elemento => {

                elemento.addEventListener(
                    "change",
                    mostrarVehiculos
                );

            }
        );


    crearBotonesMarca();

}


/*
====================================================
BOTONES DE MARCA
====================================================
*/

function crearBotonesMarca(){

    const contenedor =
        document.getElementById("marcas");


    contenedor.innerHTML = "";


    const botonTodos =
        document.createElement("button");


    botonTodos.className =
        "marca-btn activa";


    botonTodos.textContent =
        "TODAS";


    botonTodos.onclick =
        function(){

            document.getElementById(
                "filtroMarca"
            ).value = "";

            document
                .querySelectorAll(".marca-btn")
                .forEach(
                    b => b.classList.remove("activa")
                );

            botonTodos.classList.add("activa");

            mostrarVehiculos();

        };


    contenedor.appendChild(botonTodos);


    const marcas =
        [...new Set(
            vehiculos.map(v => v.marca)
        )].sort();


    marcas.forEach(
        marca => {

            const boton =
                document.createElement("button");


            boton.className =
                "marca-btn";


            boton.textContent =
                marca;


            boton.onclick =
                function(){

                    document.getElementById(
                        "filtroMarca"
                    ).value = marca;


                    document
                        .querySelectorAll(".marca-btn")
                        .forEach(
                            b => b.classList.remove("activa")
                        );


                    boton.classList.add("activa");


                    mostrarVehiculos();

                };


            contenedor.appendChild(boton);

        }
    );

}


/*
====================================================
MOSTRAR VEHICULOS
====================================================
*/

function mostrarVehiculos(){

    const marca =
        document.getElementById(
            "filtroMarca"
        ).value;


    const tipo =
        document.getElementById(
            "filtroTipo"
        ).value;


    const anio =
        document.getElementById(
            "filtroAnio"
        ).value;


    const condicion =
        document.getElementById(
            "filtroCondicion"
        ).value;


    const filtrados =
        vehiculos.filter(
            vehiculo => {

                return (

                    (!marca ||
                        vehiculo.marca === marca)

                    &&

                    (!tipo ||
                        vehiculo.tipo === tipo)

                    &&

                    (!anio ||
                        vehiculo.anio === anio)

                    &&

                    (!condicion ||
                        vehiculo.condicion === condicion)

                );

            }
        );


    const grid =
        document.getElementById(
            "gridVehiculos"
        );


    grid.innerHTML = "";


    document.getElementById(
        "sinResultados"
    ).style.display =
        filtrados.length
        ? "none"
        : "block";


    filtrados.forEach(
        vehiculo => {

            const card =
                document.createElement("article");


            card.className = "card";


            card.innerHTML = `

                <div class="card-image">

                    ${
                        vehiculo.condicion === "0km"

                        ?

                        '<span class="badge">0 KM</span>'

                        :

                        '<span class="badge">DISPONIBLE</span>'
                    }

                    <img
                        src="${vehiculo.imagenes[0]}"
                        alt="${vehiculo.marca} ${vehiculo.modelo}"
                        loading="lazy"
                    >

                </div>


                <div class="card-info">

                    <div class="marca">
                        ${vehiculo.marca}
                    </div>


                    <div class="modelo">
                        ${vehiculo.modelo}
                    </div>


                    <div class="datos">
                        ${vehiculo.datos}
                        · Año ${vehiculo.anio}
                    </div>


                    <div class="precio">
                        ${vehiculo.precio}
                    </div>


                    <button
                        class="boton-ficha"
                        onclick="abrirFicha(${vehiculo.id})">

                        VER FICHA →

                    </button>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


/*
====================================================
ABRIR FICHA
====================================================
*/

function abrirFicha(id){

    vehiculoActual =
        vehiculos.find(
            v => v.id === id
        );


    if(!vehiculoActual){
        return;
    }


    fotoActual = 0;


    document.getElementById(
        "detalleMarca"
    ).textContent =
        vehiculoActual.marca;


    document.getElementById(
        "detalleTitulo"
    ).textContent =
        vehiculoActual.modelo;


    document.getElementById(
        "detalleDescripcion"
    ).textContent =
        vehiculoActual.descripcion;


    const datos =
        document.getElementById(
            "detalleDatos"
        );


    datos.innerHTML = `

        <div class="dato">

            <small>Año</small>

            <strong>
                ${vehiculoActual.anio}
            </strong>

        </div>


        <div class="dato">

            <small>Tipo</small>

            <strong>
                ${vehiculoActual.tipo}
            </strong>

        </div>


        <div class="dato">

            <small>Condición</small>

            <strong>
                ${
                    vehiculoActual.condicion === "0km"
                    ? "0 KM"
                    : "Usado"
                }
            </strong>

        </div>


        <div class="dato">

            <small>Datos</small>

            <strong>
                ${vehiculoActual.datos}
            </strong>

        </div>


        <div class="dato">

            <small>Precio</small>

            <strong>
                ${vehiculoActual.precio}
            </strong>

        </div>

    `;


    cargarGaleria();


    document
        .getElementById("modal")
        .classList.add("activo");


    document.body.style.overflow =
        "hidden";

}


/*
====================================================
GALERIA
====================================================
*/

function cargarGaleria(){

    const foto =
        document.getElementById(
            "fotoPrincipal"
        );


    foto.src =
        vehiculoActual.imagenes[fotoActual];


    foto.alt =
        vehiculoActual.marca +
        " " +
        vehiculoActual.modelo;


    const miniaturas =
        document.getElementById(
            "miniaturas"
        );


    miniaturas.innerHTML = "";


    vehiculoActual.imagenes.forEach(
        (imagen,index) => {

            const mini =
                document.createElement("img");


            mini.src = imagen;


            mini.className =
                index === fotoActual
                ? "activa"
                : "";


            mini.onclick =
                function(){

                    fotoActual = index;

                    cargarGaleria();

                };


            miniaturas.appendChild(mini);

        }
    );

}


/*
====================================================
 FOTO SIGUIENTE
====================================================
*/

function fotoSiguiente(){

    if(!vehiculoActual){
        return;
    }


    if(
        vehiculoActual.imagenes.length <= 1
    ){
        return;
    }


    fotoActual++;


    if(
        fotoActual >=
        vehiculoActual.imagenes.length
    ){

        fotoActual = 0;

    }


    cargarGaleria();

}


/*
====================================================
 FOTO ANTERIOR
====================================================
*/

function fotoAnterior(){

    if(!vehiculoActual){
        return;
    }


    if(
        vehiculoActual.imagenes.length <= 1
    ){
        return;
    }


    fotoActual--;


    if(fotoActual < 0){

        fotoActual =
            vehiculoActual.imagenes.length - 1;

    }


    cargarGaleria();

}


/*
====================================================
 CERRAR FICHA
====================================================
*/

function cerrarFicha(){

    document
        .getElementById("modal")
        .classList.remove("activo");


    document.body.style.overflow =
        "";

}


/*
====================================================
 LIMPIAR FILTROS
====================================================
*/

function limpiarFiltros(){

    document.getElementById(
        "filtroMarca"
    ).value = "";


    document.getElementById(
        "filtroTipo"
    ).value = "";


    document.getElementById(
        "filtroAnio"
    ).value = "";


    document.getElementById(
        "filtroCondicion"
    ).value = "";


    document
        .querySelectorAll(".marca-btn")
        .forEach(
            b => b.classList.remove("activa")
        );


    const primero =
        document.querySelector(
            ".marca-btn"
        );


    if(primero){
        primero.classList.add("activa");
    }


    mostrarVehiculos();

}


/*
====================================================
 CERRAR HACIENDO CLICK AFUERA
====================================================
*/

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(e){

            if(
                e.target === this
            ){

                cerrarFicha();

            }

        }
    );


/*
====================================================
 TECLADO
====================================================
*/

document.addEventListener(
    "keydown",
    function(e){

        const modal =
            document.getElementById(
                "modal"
            );


        if(
            !modal.classList.contains("activo")
        ){
            return;
        }


        if(e.key === "Escape"){

            cerrarFicha();

        }


        if(e.key === "ArrowRight"){

            fotoSiguiente();

        }


        if(e.key === "ArrowLeft"){

            fotoAnterior();

        }

    }
);

</script>

</body>
</html>
